<script>
const TOKEN = '__TRACKER_TOKEN__';
const GROUPS = [['waiting', 'Waiting on you'], ['working', 'Working'], ['yourTurn', 'Your turn'], ['idle', 'Idle'], ['stale', 'Stale · 24h+ quiet']];
const STATE_CHIP = { waiting: '❓ Waiting on you', working: '▶ Working', yourTurn: '↩ Your turn', stale: '◌ Stale', idle: '◌ Idle' };
let snap = null;
const drafts = new Map(); // toolUseId → { picks: Map<question index, Set<label>>, other: Map<question index, text> }
const msgDrafts = new Map(); // agent id → half-typed chat message
const msgStatus = new Map(); // agent id → { text, bad, at }: the last send's result, shown under the box
const msgImages = new Map(); // agent id → screenshots waiting to go with the next message: [{ file, url, name, size }]
let pickerFor = null; // the agent the file picker is choosing screenshots for
const IMAGE_TYPES = /^image\/(png|jpeg|gif|webp)$/;
const MAX_SHOTS = 6;
const MAX_SHOT_BYTES = 10 * 1024 * 1024;
let selected = null; // the agent in the centre: the one you clicked, else the first one at work, then kept
const openChildren = new Map();
const tabs = new Map(); // agent id → { files: [absolute paths], active: a path, or '' for the agent itself }
let shownKey = ''; // which agent and tab the centre body holds, so an open file isn't redrawn on every snapshot
let viewerLoading = Promise.resolve();
// Collapsible groups (left column and explorer). Idle and stale start closed; what you close or
// open is remembered. Saving the closed ones means a group added later starts open.
const closedGroups = loadClosed();
const isOpen = key => !closedGroups.has(key);
function loadClosed() {
  try {
    const saved = JSON.parse(localStorage.getItem('tracker-closed-groups'));
    if (Array.isArray(saved)) return new Set(saved);
  } catch { /* nothing saved yet, or storage blocked */ }
  return new Set(['idle', 'stale']);
}
function toggleGroup(key) {
  if (closedGroups.has(key)) closedGroups.delete(key);
  else closedGroups.add(key);
  try { localStorage.setItem('tracker-closed-groups', JSON.stringify([...closedGroups])); } catch { /* lasts this page only */ }
  render();
  if (key.startsWith('ex-')) renderTree();
}
const groupHead = (key, title, count, extra = '') => {
  const open = isOpen(key);
  return `<div class="grp-row"><button class="grp" type="button" data-group="${key}" aria-expanded="${open}"><span class="tw">${open ? '▾' : '▸'}</span>${title}${count === '' ? '' : `<span class="grp-n">${count}</span>`}</button>${extra}</div>`;
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clock = ms => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const hhmm = ms => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const ago = ms => (!ms ? '' : Date.now() - ms < 86_400_000 ? clock(ms) : new Date(ms).toLocaleDateString([], { month: 'short', day: 'numeric' }));
const gb = mb => (mb >= 1024 ? `${(mb / 1024).toFixed(1)} GB` : `${Math.round(mb)} MB`);
const short = p => String(p ?? '').replace(/^\/Users\/[^/]+/, '~');
const shellQuote = s => `'${String(s).replace(/'/g, `'\\''`)}'`;

function elapsed(from) {
  const s = Math.max(0, Math.floor((Date.now() - from) / 1000));
  const m = Math.floor(s / 60);
  return m >= 60 ? `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}m` : `${m}:${String(s % 60).padStart(2, '0')}`;
}

// Colour follows the agent, never its rank or screen order: each agent's preferred slot comes
// from a hash of its id, new agents are placed in id order, and an agent keeps its slot while it
// is on screen (freed when it goes away). So a reload shows the same colours. Past eight, grey.
const agentSlots = new Map();
const preferredSlot = id => {
  let h = 0;
  for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return (h % 8) + 1;
};
function syncSlots(agents) {
  const live = new Set(agents.map(a => a.id));
  for (const id of [...agentSlots.keys()]) if (!live.has(id)) agentSlots.delete(id);
  const fresh = agents.map(a => a.id).filter(id => !agentSlots.has(id)).sort();
  for (const id of fresh) {
    const used = new Set(agentSlots.values());
    let slot = 'other';
    for (let k = 0; k < 8; k++) {
      const candidate = ((preferredSlot(id) - 1 + k) % 8) + 1;
      if (!used.has(candidate)) { slot = candidate; break; }
    }
    agentSlots.set(id, slot);
  }
}
const colorOf = id => (agentSlots.get(id) === 'other' || !agentSlots.has(id) ? 'var(--s-other)' : `var(--s${agentSlots.get(id)})`);

function updateTimers() {
  for (const el of document.querySelectorAll('[data-since]')) el.textContent = elapsed(Number(el.dataset.since));
  for (const el of document.querySelectorAll('[data-until]')) el.textContent = `${Math.max(0, Math.ceil((Number(el.dataset.until) - Date.now()) / 1000))}s`;
  if (snap) {
    const age = Math.max(0, Math.round((Date.now() - snap.generatedAt) / 1000));
    $('meta').textContent = `tracker ${snap.collector.cpu}% CPU · ${snap.collector.rssMb} MB · updated ${age}s ago`;
  }
}

/* ---------- marks ---------- */

function sparkline(values, color, floorMax) {
  const W = 100, H = 22;
  if (!values?.length) return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"></svg>`;
  const top = Math.max(floorMax ?? 0, ...values, 1);
  const n = values.length;
  const pts = values.map((v, i) => [n === 1 ? W : (i / (n - 1)) * W, H - 2 - (Math.min(v, top) / top) * (H - 4)]);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d}L${W},${H}L${pts[0][0].toFixed(1)},${H}Z" fill="${color}" opacity=".12"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function meter(fraction, severity, tip) {
  const pct = Math.max(2, Math.min(100, fraction * 100));
  return `<span class="meter ${severity}" data-tip="${esc(tip)}"><i style="width:${pct.toFixed(1)}%"></i></span>`;
}
const severityOf = (ratio, warnAt, critAt) => (ratio < warnAt ? 'ok' : ratio < critAt ? 'warn' : 'crit');

function heatStrip(activity) {
  const counts = activity?.length === 30 ? activity : new Array(30).fill(0);
  const now = Date.now();
  const cells = counts.map((n, i) => {
    const level = n === 0 ? 0 : n === 1 ? 1 : n <= 3 ? 2 : n <= 7 ? 3 : 4;
    return `<i class="h h${level}" data-tip="${hhmm(now - (29 - i) * 60_000)} · ${n} tool call${n === 1 ? '' : 's'}"></i>`;
  }).join('');
  return `<div class="heat" role="img" aria-label="Tool calls per minute over the last 30 minutes">${cells}</div>
    <div class="heat-label"><span>30 min ago</span><span>tool calls per minute</span><span>now</span></div>`;
}

function niceMax(v) {
  const p = 10 ** Math.floor(Math.log10(Math.max(v, 1)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}

/** A 10-minute line chart with hairline grid, end dot, crosshair and tooltip. One measure per chart. */
function lineChart(title, at, values, color, format) {
  if (!values?.length) return `<div class="chartbox"><div class="ptitle">${esc(title)}</div><div class="empty">No samples yet.</div></div>`;
  const W = 380, H = 160, L = 46, R = 10, T = 10, B = 22;
  const now = Date.now(), t0 = now - 10 * 60_000;
  const maxV = niceMax(Math.max(...values));
  const x = t => L + Math.max(0, Math.min(1, (t - t0) / (now - t0))) * (W - L - R);
  const y = v => T + (1 - Math.min(v, maxV) / maxV) * (H - T - B);
  const pts = values.map((v, i) => [x(at[i]), y(v)]);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('');
  const area = `${d}L${pts.at(-1)[0].toFixed(1)},${H - B}L${pts[0][0].toFixed(1)},${H - B}Z`;
  const grid = [0, maxV / 2, maxV].map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${L - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${esc(format(v))}</text>`).join('');
  const xl = [[t0, '−10m', 'start'], [now - 5 * 60_000, '−5m', 'middle'], [now, 'now', 'end']]
    .map(([t, s, anchor]) => `<text x="${x(t).toFixed(1)}" y="${H - 6}" text-anchor="${anchor}">${s}</text>`).join('');
  const last = pts.at(-1);
  const data = { x: pts.map(p => +p[0].toFixed(1)), y: pts.map(p => +p[1].toFixed(1)), t: values.map((v, i) => `${clock(at[i])} · ${format(v)}`) };
  return `<div class="chartbox"><div class="ptitle">${esc(title)}<span class="pv">${esc(format(values.at(-1)))}</span></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} over the last 10 minutes" data-chart="${esc(JSON.stringify(data))}">
      ${grid}${xl}
      <path class="area" d="${area}" fill="${color}"/>
      <path class="line" d="${d}" stroke="${color}"/>
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="${color}" stroke="var(--panel)" stroke-width="2"/>
      <line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}"/>
      <circle class="xd" r="4" fill="${color}"/>
      <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>
    </svg></div>`;
}

// Tool calls by kind: three categorical slots (validated all-pairs) plus grey for the rest;
// lanes are labelled, so no separate legend is needed.
const LANES = [['Shell', /^(Bash|BashOutput|KillShell)$/, 'var(--s1)'], ['Edit', /^(Edit|MultiEdit|Write|NotebookEdit)$/, 'var(--s2)'], ['Read', /^(Read|Grep|Glob|LS|WebFetch|WebSearch)$/, 'var(--s3)'], ['Other', /./, 'var(--s-other)']];
function timelineChart(timeline) {
  const W = 760, H = 124, L = 52, R = 12, T = 6, B = 20, lane = (H - T - B) / LANES.length;
  const now = Date.now(), t0 = now - 30 * 60_000;
  const x = t => L + Math.max(0, Math.min(1, (t - t0) / (now - t0))) * (W - L - R);
  const laneY = i => T + lane * i + lane / 2;
  const rows = LANES.map(([name], i) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${laneY(i).toFixed(1)}" y2="${laneY(i).toFixed(1)}"/><text x="${L - 8}" y="${(laneY(i) + 3).toFixed(1)}" text-anchor="end">${name}</text>`).join('');
  const xl = [[t0, '−30m', 'start'], [now - 15 * 60_000, '−15m', 'middle'], [now, 'now', 'end']]
    .map(([t, s, anchor]) => `<text x="${x(t).toFixed(1)}" y="${H - 5}" text-anchor="${anchor}">${s}</text>`).join('');
  const dots = (timeline ?? []).map(c => {
    const li = LANES.findIndex(([, re]) => re.test(c.tool));
    const cx = x(c.at).toFixed(1), cy = laneY(li).toFixed(1);
    return `<g data-tip="${esc(`${clock(c.at)} · ${c.tool}`)}"><circle cx="${cx}" cy="${cy}" r="11" fill="transparent"/><circle cx="${cx}" cy="${cy}" r="4" fill="${LANES[li][2]}" stroke="var(--panel)" stroke-width="2"/></g>`;
  }).join('');
  return `<div class="timeline"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tool calls by kind over the last 30 minutes">${rows}${xl}${dots}</svg></div>`;
}

/* ---------- sections ---------- */

function kpisHtml() {
  const c = snap.counts;
  const waiting = snap.agents.filter(a => a.state === 'waiting');
  const oldest = waiting.reduce((m, a) => Math.min(m, a.stateSince || Infinity), Infinity);
  const withSubagents = snap.agents.filter(a => a.children?.some(ch => ch.state === 'running')).length;
  const tiles = [
    ['k-waiting', '❓', 'Waiting on you', c.waiting, c.waiting ? `oldest waiting <b data-since="${oldest}"></b>` : 'all clear', c.waiting > 0],
    ['k-working', '▶', 'Working', c.working, withSubagents ? `${withSubagents} running subagents` : `${snap.agents.length} agents tracked`, false],
    ['k-turn', '↩', 'Your turn', c.yourTurn, `${c.idle} idle · ${c.stale} stale`, false],
    ['k-collide', '⚠', 'Collisions', c.collisions, c.collisions ? 'two agents writing one repo' : 'none', c.collisions > 0],
  ];
  return tiles.map(([k, icon, label, val, sub, hot]) => `<div class="kpi ${k}${hot ? ' hot' : ''}"><span>${icon}</span><span class="kpi-label">${label}</span><b class="val">${val}</b><span class="sub">${sub}</span></div>`).join('');
}

/** The agents' share of this Mac, in the top bar: memory by agent, and CPU as a share of all cores. */
function hstatsHtml() {
  const totalMb = snap.machine?.totalMemMb || 1;
  const withMem = snap.agents.filter(a => a.proc?.rssMb).sort((x, y) => y.proc.rssMb - x.proc.rssMb);
  const usedMb = withMem.reduce((t, a) => t + a.proc.rssMb, 0);
  const memBar = `<span class="hbar">${withMem.map(a => `<i style="width:${Math.max(1.5, (a.proc.rssMb / totalMb) * 100).toFixed(2)}%;background:${colorOf(a.id)}" data-tip="${esc(`${a.name} · ${gb(a.proc.rssMb)}`)}"></i>`).join('')}</span>`;
  const cores = snap.machine?.cpuCount || 1;
  const cpuUsed = snap.agents.reduce((t, a) => t + (a.proc?.cpu ?? 0), 0);
  const cpuRatio = cpuUsed / (cores * 100);
  return `<span class="hstat" data-tip="${esc(`Memory used by agents · ${withMem.map(a => `${a.name} ${gb(a.proc.rssMb)}`).join(' · ') || 'none'}`)}"><span class="ml">Agents RAM</span>${memBar}<b>${gb(usedMb)}</b><span class="faint">of ${gb(totalMb)}</span></span>
    <span class="hstat"><span class="ml">Agents CPU</span>${meter(cpuRatio, severityOf(cpuRatio, 0.5, 0.8), `${Math.round(cpuUsed)}% of one core · ${cores} cores`)}<b>${Math.round(cpuRatio * 100)}% of this Mac</b></span>`;
}

function askLine(a) {
  if (a.ask?.kind === 'question') return `❓ ${esc(a.ask.questions[0]?.question ?? a.stateReason)}`;
  if (a.ask?.kind === 'permission') return `🔐 <b>${esc(a.ask.tool)}</b> <span class="mono">${esc(a.ask.summary)}</span>`;
  return `❓ ${esc(a.stateReason)}`;
}

function metricsHtml(a) {
  const parts = [];
  if (a.proc) {
    const cpuHist = a.proc.history?.cpu ?? [];
    parts.push(`<div class="m" data-tip="CPU now ${Math.round(a.proc.cpu)}% · peak ${Math.round(Math.max(0, ...cpuHist))}% in 10 min"><span class="ml">CPU</span>${sparkline(cpuHist, colorOf(a.id), 100)}<span class="mv">${Math.round(a.proc.cpu)}%</span></div>`);
    const limitMb = (snap.settings?.memoryAlertGb ?? 2) * 1024;
    const sev = severityOf(a.proc.rssMb / limitMb, 0.6, 0.85);
    parts.push(`<div class="m"><span class="ml">RAM</span>${meter(a.proc.rssMb / limitMb, sev, `${gb(a.proc.rssMb)} of the ${gb(limitMb)} alert line`)}<span class="mv">${gb(a.proc.rssMb)}${sev === 'ok' ? '' : ' ⚠'}</span></div>`);
  }
  if (a.contextTokens) {
    const limit = a.contextTokens > 200_000 ? 1_000_000 : 200_000;
    const r = a.contextTokens / limit;
    parts.push(`<div class="m"><span class="ml">Context</span>${meter(r, severityOf(r, 0.7, 0.9), `${Math.round(a.contextTokens / 1000)}k of ${limit / 1000}k tokens`)}<span class="mv">${Math.round(r * 100)}%</span></div>`);
  }
  const heat = a.kind === 'codex' ? '' : heatStrip(a.activity);
  return `${parts.length ? `<div class="metrics">${parts.join('')}</div>` : ''}${heat}`;
}

/** One compact agent row: name and numbers, then one line of what it is doing. */
function rowHtml(a) {
  const sub = a.state === 'waiting' ? `${askLine(a)} · <span data-since="${a.stateSince}"></span>`
    : a.now ? `<span class="pulse"></span><span class="mono">${esc(a.now.tool)} ${esc(a.now.summary)} · <span data-since="${a.now.startedAt}"></span></span>`
    : a.state === 'yourTurn' ? esc(a.lastReply ?? 'finished')
    : '';
  const nums = a.state === 'stale' ? `<span class="rn">${ago(a.lastActivityAt)}</span>`
    : a.proc ? `<span class="rn">${Math.round(a.proc.cpu)}%</span><span class="rn">${gb(a.proc.rssMb)}</span>` : '';
  return `<button class="row ${a.state}${a.id === selected ? ' sel' : ''}" data-id="${esc(a.id)}" data-tip="${esc(`${short(a.cwd)}${a.kind === 'background' ? ' · background' : ''}`)}">
    <span class="rtop"><span class="swatch" style="background:${colorOf(a.id)}"></span><span class="name">${esc(a.name)}</span>${a.ask ? '<span class="chip c-waiting live-dot">answer here</span>' : ''}<span class="grow"></span>${nums}</span>${sub ? `<span class="rsub">${sub}</span>` : ''}</button>`;
}

function listHtml() {
  let html = '';
  for (const [state, title] of GROUPS) {
    const agents = snap.agents.filter(a => a.state === state);
    if (!agents.length) continue;
    const open = isOpen(state);
    html += groupHead(state, title, agents.length, state === 'stale' && open ? '<button class="act mini" id="open-cleanup" type="button">Clean up…</button>' : '');
    if (open) html += agents.map(rowHtml).join('');
  }
  return html || '<div class="empty">No agents are running.</div>';
}

function deployChip(d) {
  if (!d) return '';
  if (d.status === 'completed') {
    return d.conclusion === 'success' ? '<span class="chip c-good">✓ deployed</span>'
      : d.conclusion === 'failure' ? `<span class="chip c-crit" data-tip="${esc(`${d.workflow ?? 'Deploy'} failed at ${d.sha}`)}">✗ deploy failed</span>`
      : `<span class="chip c-plain">${esc(d.conclusion ?? 'done')}</span>`;
  }
  return `<span class="chip c-warn live-dot" data-tip="${esc(`${d.workflow ?? 'Deploy'} ${d.status} · ${d.sha}`)}">deploying</span>`;
}

function railHtml() {
  const colliding = new Set(snap.collisions.map(c => c.repo));
  const who = ids => ids.map(id => {
    const a = snap.agents.find(x => x.id === id);
    return `<span class="chip c-plain"><i class="key" style="background:${colorOf(id)}"></i>${esc(a?.name ?? id)}</span>`;
  }).join(' ');
  let html = snap.collisions.length
    ? `<div class="sec">⚠ Collisions · ${snap.collisions.length}</div>${snap.collisions.map(c => `<div class="card collide"><div class="top"><span class="chip c-serious">⚠ ${esc(c.severity)}</span><b>${esc(c.repo.split('/').pop())}</b></div><div class="muted" style="margin-top:4px">${esc(c.reason)} · since ${clock(c.since)}</div><div class="badges">${who(c.agentIds)}</div></div>`).join('')}`
    : '';
  html += groupHead('repos', 'Repos', snap.repos.length);
  if (!isOpen('repos')) return html;
  html += snap.repos.map(r => {
    const dirty = r.dirty ?? 0;
    const dirtyMeter = r.dirty === undefined ? '' : `<div class="m" style="margin-top:8px"><span class="ml">Changes</span>${meter(Math.min(dirty, 20) / 20, severityOf(dirty / 20, 0.5, 0.9), `${dirty} uncommitted file${dirty === 1 ? '' : 's'}`)}<span class="mv">${dirty ? `${dirty} uncommitted` : 'clean ✓'}</span></div>`;
    const sync = r.ahead === undefined ? '' : `<span class="chip c-plain" data-tip="against origin, as of the last fetch">↑${r.ahead} ↓${r.behind}</span>`;
    const agents = r.agentIds.length ? `<span class="chip ${colliding.has(r.path) ? 'c-serious' : 'c-plain'}">${r.agentIds.length} agent${r.agentIds.length > 1 ? 's' : ''}</span>` : '';
    return `<div class="card${colliding.has(r.path) ? ' collide' : ''}" title="${esc(r.path)}"><div class="top"><b>${esc(r.name)}</b><span class="chip c-plain">⎇ ${esc(r.branch ?? '?')}</span>${deployChip(r.deploy)}</div>${dirtyMeter}<div class="badges">${sync}${agents}${who(r.agentIds)}</div></div>`;
  }).join('') || '<div class="empty">No repos touched in the last 30 minutes.</div>';
  return html;
}

function feedRow(f) {
  const what = f.kind === 'tool' ? `🔧 <b>${esc(f.tool)}</b> ${esc(f.text)}` : f.kind === 'prompt' ? `👤 ${esc(f.text)}` : `💬 ${esc(f.text)}`;
  let result = '';
  if (f.kind === 'tool') {
    if (f.ok === undefined) result = '<span class="faint">running…</span>';
    else {
      const ms = f.durationMs ?? 0;
      const width = Math.max(4, Math.min(64, (Math.log10(ms + 1) / Math.log10(600_001)) * 64));
      result = `<span class="dur${f.ok ? '' : ' bad'}" data-tip="${f.ok ? 'Succeeded' : 'Failed'} after ${(ms / 1000).toFixed(1)}s"><i style="width:${width.toFixed(0)}px"></i>${f.ok ? '✓' : '✗'} ${(ms / 1000).toFixed(1)}s</span>`;
    }
  }
  return `<div><span class="t mono">${hhmm(f.at)}</span><span class="what">${what}</span><span>${result}</span></div>`;
}

function draftFor(toolUseId) {
  if (!drafts.has(toolUseId)) drafts.set(toolUseId, { picks: new Map(), other: new Map() });
  return drafts.get(toolUseId);
}

/** The answer form at the top of a waiting agent's drawer. */
function askHtml(a) {
  const ask = a.ask;
  if (!ask) {
    return a.state === 'waiting'
      ? `<div class="ask"><div class="sec" style="margin-top:0">${a.stateReason === 'question pending' ? '❓' : '🔐'} Waiting on you</div><div>${askLine(a)}</div>
          <div class="muted" style="margin-top:6px">The dashboard can't answer this one, so answer it in its terminal. (Its session isn't listening for dashboard answers: it may have started before the Agent Tracker mod was installed.)</div></div>`
      : '';
  }
  const ids = `data-agent="${esc(a.id)}" data-tool="${esc(ask.toolUseId)}"`;
  if (ask.kind === 'permission') {
    return `<div class="ask"><div class="sec" style="margin-top:0">🔐 Permission needed</div>
      <div><b>${esc(ask.tool)}</b> wants to run:</div><div class="now mono" style="margin:5px 0 7px">${esc(ask.summary)}</div>
      <div class="muted" style="margin-bottom:8px">Moves to the terminal prompt in <b data-until="${ask.expiresAt}"></b></div>
      <button class="act primary" id="ask-allow" ${ids}>Allow</button><button class="act" id="ask-deny" ${ids}>Deny</button></div>`;
  }
  const d = draftFor(ask.toolUseId);
  const questions = ask.questions.map((q, qi) => {
    const picks = d.picks.get(qi) ?? new Set();
    const type = q.multiSelect ? 'checkbox' : 'radio';
    const field = `data-tool="${esc(ask.toolUseId)}" data-q="${qi}"`;
    const options = q.options.map(o => `<label class="opt"><input type="${type}" name="${esc(ask.toolUseId)}-${qi}" value="${esc(o.label)}" ${field}${picks.has(o.label) ? ' checked' : ''}> <span>${esc(o.label)}${o.description ? ` <span class="muted">— ${esc(o.description)}</span>` : ''}</span></label>`).join('');
    return `<fieldset><legend>${q.header ? `<span class="pill">${esc(q.header)}</span> ` : ''}${esc(q.question)}</legend>${options}
      <input type="text" class="other" placeholder="Other…" ${field} value="${esc(d.other.get(qi) ?? '')}"></fieldset>`;
  }).join('');
  return `<div class="ask"><div class="sec" style="margin-top:0">❓ Needs your answer</div>${questions}<button class="act primary" id="ask-send" ${ids}>Send answer</button></div>`;
}

/** Chat box: sends a message, with any screenshots, into the session as the person's own words (queued if it is busy). */
function composeHtml(a) {
  if (a.kind === 'codex') return '';
  const live = Boolean(a.mod?.live);
  const hint = !live ? "This session isn't listening for dashboard messages yet. Send it anything in its terminal once, or start a new session."
    : a.state === 'working' ? `${esc(a.name)} is busy: your message waits until its current step ends. ⌘↩ sends.`
    : 'Sent as your own message. Paste or drop screenshots on the box. ⌘↩ sends.';
  const sent = msgStatus.get(a.id);
  const status = sent && Date.now() - sent.at < 20_000
    ? `<span id="msg-status" class="${sent.bad ? 'msg-bad' : 'msg-ok'}">${esc(sent.text)}</span>`
    : `<span id="msg-status" class="faint">${hint}</span>`;
  const imgs = msgImages.get(a.id) ?? [];
  const thumbs = imgs.length ? `<div class="thumbs">${imgs.map((im, i) => `<span class="thumb" data-tip="${esc(`${im.name} · ${sizeText(im.size)}`)}"><img src="${esc(im.url)}" alt="Screenshot ${i + 1}"><button type="button" class="thumb-x" data-remove-img="${i}" data-agent="${esc(a.id)}" aria-label="Remove screenshot ${i + 1}">✕</button></span>`).join('')}</div>` : '';
  return `<div class="compose" data-agent="${esc(a.id)}" style="margin-top:10px"><textarea id="msg-text" data-msg-agent="${esc(a.id)}" rows="2" placeholder="Message ${esc(a.name)}…"${live ? '' : ' disabled'}>${esc(msgDrafts.get(a.id) ?? '')}</textarea>${thumbs}
    <div class="compose-row">${status}<span class="grow"></span><button class="act" id="msg-attach" type="button" data-agent="${esc(a.id)}" data-tip="Attach screenshots (you can also paste or drop them on the box)"${live ? '' : ' disabled'}>📎 Screenshot</button><button class="act primary" id="msg-send" data-agent="${esc(a.id)}"${live ? '' : ' disabled'}>Send</button></div></div>`;
}

const sizeText = bytes => (bytes >= 1_048_576 ? `${(bytes / 1_048_576).toFixed(1)} MB` : `${Math.max(1, Math.round(bytes / 1024))} KB`);

function toBase64(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

/** Screenshots pasted, dropped or picked for an agent's next message. */
function addImages(agentId, files) {
  const list = msgImages.get(agentId) ?? [];
  let refused = '';
  for (const file of files) {
    if (!IMAGE_TYPES.test(file?.type ?? '')) { refused = 'Only PNG, JPEG, GIF and WebP images can be attached.'; continue; }
    if (file.size > MAX_SHOT_BYTES) { refused = `${file.name} is too large (10 MB at most).`; continue; }
    if (list.length >= MAX_SHOTS) { refused = `At most ${MAX_SHOTS} screenshots per message.`; break; }
    list.push({ file, url: URL.createObjectURL(file), name: file.name || 'screenshot.png', size: file.size });
  }
  msgImages.set(agentId, list);
  if (refused) msgStatus.set(agentId, { at: Date.now(), bad: true, text: refused });
  render();
}

function removeImage(agentId, index) {
  const list = msgImages.get(agentId) ?? [];
  const [gone] = list.splice(index, 1);
  if (gone) URL.revokeObjectURL(gone.url);
  render();
}

async function sendMessage(agentId, button) {
  const text = (msgDrafts.get(agentId) ?? '').trim();
  const imgs = msgImages.get(agentId) ?? [];
  if (!text && !imgs.length) {
    msgStatus.set(agentId, { at: Date.now(), bad: true, text: 'Type a message or add a screenshot first.' });
    render();
    return;
  }
  const agent = snap?.agents.find(a => a.id === agentId);
  if (button) {
    button.disabled = true;
    button.textContent = 'Sending…';
  }
  let images = [];
  try {
    images = await Promise.all(imgs.map(async im => ({ name: im.name, data: toBase64(new Uint8Array(await im.file.arrayBuffer())) })));
  } catch (err) {
    msgStatus.set(agentId, { at: Date.now(), bad: true, text: `Could not read a screenshot: ${err?.message ?? err}` });
    render();
    return;
  }
  const r = await post('/api/actions/message', images.length ? { agentId, text, images } : { agentId, text });
  if (r.ok) {
    msgDrafts.delete(agentId);
    for (const im of imgs) URL.revokeObjectURL(im.url);
    msgImages.delete(agentId);
  }
  const extra = images.length ? ` with ${images.length} screenshot${images.length > 1 ? 's' : ''}` : '';
  msgStatus.set(agentId, {
    at: Date.now(),
    bad: !r.ok,
    text: r.ok ? (agent?.state === 'working' ? `Queued for ${agent.name}${extra}: it reads it when its current step ends.` : `✓ Sent to ${agent?.name ?? 'the session'}${extra}.`) : `Not sent: ${r.error}`,
  });
  render();
}

// Markdown for the document reader. Every character of the file is escaped; the only HTML that
// comes out is what these functions build. Links go out only to http(s) and mailto, images show
// their alt text (nothing is fetched), and raw HTML in the file shows as text.
const MD_LIST_ITEM = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/;
const MD_HR = /^\s{0,3}([-*_])(\s*\1){2,}\s*$/;
const MD_FENCE = /^\s{0,3}(`{3,}|~{3,})\s*([\w+#.-]*)/;
const MD_HEADING = /^\s{0,3}(#{1,6})\s+(.*?)(?:\s+#+)?\s*$/;
const MD_QUOTE = /^\s{0,3}>/;
const mdSlug = text => String(text).toLowerCase().replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-');
const mdCells = line => line.trim().replace(/^\|/, '').replace(/\|$/, '').split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, '|'));

function mdTableAt(lines, i) {
  if (!lines[i].includes('|') || i + 1 >= lines.length) return null;
  const head = mdCells(lines[i]);
  const sep = mdCells(lines[i + 1]);
  if (sep.length !== head.length || !sep.every(c => /^:?-+:?$/.test(c))) return null;
  return { head, align: sep.map(c => (c.endsWith(':') ? (c.startsWith(':') ? 'center' : 'right') : '')) };
}

const mdStartsBlock = (lines, i) => MD_FENCE.test(lines[i]) || MD_HEADING.test(lines[i]) || MD_HR.test(lines[i])
  || MD_QUOTE.test(lines[i]) || MD_LIST_ITEM.test(lines[i]) || Boolean(mdTableAt(lines, i));

function mdEmphasis(s) {
  return s
    .replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^\w_])__(?=\S)([\s\S]*?\S)__(?!\w)/g, '$1<strong>$2</strong>')
    .replace(/(^|[^\w*])\*(?=\S)([^*]*?\S)\*(?![\w*])/g, '$1<em>$2</em>')
    .replace(/(^|[^\w_])_(?=\S)([^_]*?\S)_(?!\w)/g, '$1<em>$2</em>')
    .replace(/~~(?=\S)([\s\S]*?\S)~~/g, '<del>$1</del>');
}

function mdInline(text) {
  const held = [];
  const hold = html => `\u0000${held.push(html) - 1}\u0000`;
  let s = String(text).replace(/\u0000/g, '');
  s = s.replace(/(`+)([\s\S]*?[^`])\1(?!`)/g, (_, _ticks, code) => hold(`<code>${esc(code.trim())}</code>`));
  s = esc(s);
  s = s.replace(/!\[([^\]]*)\]\([^)]*\)/g, (_, alt) => hold(`<span class="md-link" title="Images aren't loaded here">🖼 ${alt || 'image'}</span>`));
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;[\s\S]*?&quot;)?\)/g, (_, label, url) => {
    const raw = url.replace(/&amp;/g, '&');
    if (/^(https?:|mailto:)/i.test(raw)) return hold(`<a href="${url}" target="_blank" rel="noopener noreferrer">${mdEmphasis(label)}</a>`);
    if (raw.startsWith('#')) return hold(`<a href="#md-${mdSlug(raw.slice(1))}">${mdEmphasis(label)}</a>`);
    return hold(`<span class="md-link" title="${url}">${mdEmphasis(label)}</span>`);
  });
  s = s.replace(/&lt;((?:https?:|mailto:)[^\s&]+)&gt;/g, (_, url) => hold(`<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`));
  s = mdEmphasis(s);
  for (let n = 0; n < 4 && s.includes('\u0000'); n++) s = s.replace(/\u0000(\d+)\u0000/g, (_, k) => held[k]);
  return s;
}

function mdList(lines, start) {
  const first = lines[start].match(MD_LIST_ITEM);
  const indent = first[1].length;
  const ordered = /\d/.test(first[2]);
  const items = [];
  let i = start;
  while (i < lines.length) {
    const line = lines[i];
    const m = line.match(MD_LIST_ITEM);
    if (m && m[1].length === indent && /\d/.test(m[2]) === ordered) {
      items.push({ text: [m[3]], inner: [] });
      i++;
    } else if (m && m[1].length > indent) {
      const [html, next] = mdList(lines, i);
      items.at(-1).inner.push(html);
      i = next;
    } else if (!m && line.trim() && !mdStartsBlock(lines, i)) {
      items.at(-1).text.push(line.trim());
      i++;
    } else if (!line.trim()) {
      let j = i;
      while (j < lines.length && !lines[j].trim()) j++;
      const n = lines[j]?.match(MD_LIST_ITEM);
      if (!n || n[1].length < indent || (n[1].length === indent && /\d/.test(n[2]) !== ordered)) break;
      i = j;
    } else {
      break;
    }
  }
  const li = it => {
    const text = it.text.join(' ');
    const task = text.match(/^\[([ xX])\]\s+(.*)$/);
    const body = task ? `<input type="checkbox" disabled${task[1] === ' ' ? '' : ' checked'}> ${mdInline(task[2])}` : mdInline(text);
    return `<li${task ? ' class="task"' : ''}>${body}${it.inner.join('')}</li>`;
  };
  const tag = ordered ? 'ol' : 'ul';
  const from = ordered ? Number.parseInt(first[2], 10) : 1;
  return [`<${tag}${from !== 1 ? ` start="${from}"` : ''}>${items.map(li).join('')}</${tag}>`, i];
}

function renderMarkdown(src, nested = false) {
  const lines = String(src ?? '').replace(/\r\n?/g, '\n').replace(/\t/g, '    ').split('\n');
  const out = [];
  let i = 0;
  if (!nested && lines[0]?.trim() === '---') {
    const end = lines.findIndex((l, k) => k > 0 && l.trim() === '---');
    if (end > 0) {
      out.push(`<pre class="md-front">${esc(lines.slice(1, end).join('\n'))}</pre>`);
      i = end + 1;
    }
  }
  while (i < lines.length) {
    const line = lines[i];
    let m;
    if (!line.trim()) {
      i++;
    } else if ((m = line.match(MD_FENCE))) {
      const body = [];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith(m[1])) body.push(lines[i++]);
      i++;
      out.push(`<pre class="md-code"${m[2] ? ` data-lang="${esc(m[2])}"` : ''}><code>${esc(body.join('\n'))}</code></pre>`);
    } else if ((m = line.match(MD_HEADING))) {
      const level = m[1].length;
      out.push(`<h${level} id="md-${mdSlug(m[2])}">${mdInline(m[2])}</h${level}>`);
      i++;
    } else if (MD_HR.test(line)) {
      out.push('<hr>');
      i++;
    } else if (MD_QUOTE.test(line)) {
      const body = [];
      while (i < lines.length && MD_QUOTE.test(lines[i])) body.push(lines[i++].replace(/^\s{0,3}>\s?/, ''));
      out.push(`<blockquote>${renderMarkdown(body.join('\n'), true)}</blockquote>`);
    } else if ((m = mdTableAt(lines, i))) {
      const { head, align } = m;
      const cell = (tag, text, k) => `<${tag}${align[k] ? ` style="text-align:${align[k]}"` : ''}>${mdInline(text)}</${tag}>`;
      const rows = [];
      i += 2;
      while (i < lines.length && lines[i].trim() && lines[i].includes('|')) rows.push(mdCells(lines[i++]));
      out.push(`<div class="md-scroll"><table><thead><tr>${head.map((c, k) => cell('th', c, k)).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${head.map((_, k) => cell('td', r[k] ?? '', k)).join('')}</tr>`).join('')}</tbody></table></div>`);
    } else if (MD_LIST_ITEM.test(line)) {
      const [html, next] = mdList(lines, i);
      out.push(html);
      i = next;
    } else {
      const para = [];
      do para.push(lines[i++].trim());
      while (i < lines.length && lines[i].trim() && !mdStartsBlock(lines, i));
      out.push(`<p>${mdInline(para.join(' '))}</p>`);
    }
  }
  return out.join('\n');
}

// The file viewer: a file from the agent's folder (or a markdown document it opened elsewhere),
// read-only in a centre tab, with a reply box that messages the agent about it. Markdown is
// rendered; anything else is shown as text with line numbers.
let reader = null; // { agentId, path, at } for the file tab on screen
let readerQuote = '';
let readerLines = null; // [first, last] line numbers of the quoted code selection
const readerDrafts = new Map(); // agent id + path → half-typed reply
const readerKey = () => (reader ? `${reader.agentId}\n${reader.path}` : '');
const docName = path => String(path).split('/').pop();
const isMarkdown = path => path === '@summary' || /\.(md|markdown|mdx)$/i.test(path);
const docEntry = (agentId, path) => snap?.agents.find(a => a.id === agentId)?.docs?.find(d => d.path === path);
/** The path as the agent knows it: relative to its folder when inside it. */
const docLabel = (agent, path) => (path === '@summary' ? 'your conversation summary' : agent?.cwd && path.startsWith(`${agent.cwd}/`) ? path.slice(agent.cwd.length + 1) : path);
/** When the agent last wrote or read a file: from its documents, or from the explorer listing. */
function touchOf(agentId, path) {
  const doc = docEntry(agentId, path);
  const root = explorer.agentId === agentId ? explorer.data?.root : null;
  const listed = root && path.startsWith(`${root}/`) ? explorer.data.touched?.[path.slice(root.length + 1)] : null;
  if (!doc) return listed ?? null;
  if (!listed) return doc;
  return { wrote: doc.wrote || listed.wrote, at: Math.max(doc.at, listed.at) };
}
const docSub = (agent, path) => {
  if (path === '@summary') return 'What this session remembers of its earlier conversation, written when it was compacted';
  const t = agent ? touchOf(agent.id, path) : null;
  return `${docLabel(agent, path)}${t ? ` · ${t.wrote ? 'written' : 'read'} by ${agent.name} at ${hhmm(t.at)}` : ''}`;
};

function docsHtml(a) {
  if (!a.docs?.length) return '';
  return `<div class="sec">Documents</div><div class="docs">${a.docs.map(d => {
    const dir = docLabel(a, d.path).split('/').slice(0, -1).join('/');
    return `<button class="doc" type="button" data-doc-agent="${esc(a.id)}" data-doc-path="${esc(d.path)}" data-tip="${esc(short(d.path))}"><span aria-hidden="true">📄</span><span class="doc-name">${esc(docName(d.path))}</span><span class="doc-dir faint">${esc(short(dir))}</span><span class="chip ${d.wrote ? 'c-warn' : 'c-plain'}">${d.wrote ? 'written' : 'read'}</span><span class="faint">${hhmm(d.at)}</span></button>`;
  }).join('')}</div>`;
}

const tabsOf = id => {
  if (!tabs.has(id)) tabs.set(id, { files: [], active: '' });
  return tabs.get(id);
};

function tabsHtml(a, t) {
  const agentTab = `<div class="tab${t.active ? '' : ' on'}"><button type="button" data-tab=""><span class="swatch" style="background:${colorOf(a.id)}"></span>${esc(a.name)}</button></div>`;
  return agentTab + t.files.map(f => `<div class="tab${t.active === f ? ' on' : ''}"><button type="button" data-tab="${esc(f)}" data-tip="${esc(f === '@summary' ? 'What this session remembers of its earlier conversation' : short(f))}">${f === '@summary' ? '🧠' : isMarkdown(f) ? '📄' : '⌗'} ${esc(fileLabel(f))}</button><button type="button" class="x" data-close-tab="${esc(f)}" aria-label="Close ${esc(fileLabel(f))}">✕</button></div>`).join('');
}

function readerHtml() {
  const agent = snap?.agents.find(a => a.id === reader.agentId);
  const live = Boolean(agent?.mod?.live);
  const hint = live ? 'Select text above, then Quote to reply about that part. ⌘↩ sends.'
    : "This session isn't listening for dashboard messages yet. Send it anything in its terminal once, or start a new session.";
  return `<div class="reader-head">
      <div class="reader-title"><b>${reader.path === '@summary' ? '🧠' : isMarkdown(reader.path) ? '📄' : '⌗'} ${esc(fileLabel(reader.path))}</b><div class="faint mono" id="reader-sub">${esc(docSub(agent, reader.path))}</div></div>
      <span class="grow"></span>
      <button class="act" id="reader-reload" type="button">↻ Reload</button>
    </div>
    <article id="reader-body" class="${isMarkdown(reader.path) ? 'md' : 'codeview'}"></article>
    <div class="reader-foot compose">
      <textarea id="reader-text" rows="2" placeholder="Reply to ${esc(agent?.name ?? 'the agent')} about this file…"${live ? '' : ' disabled'}>${esc(readerDrafts.get(readerKey()) ?? '')}</textarea>
      <div class="compose-row"><span class="faint" id="reader-status">${hint}</span><span class="grow"></span><button class="act" id="reader-quote" type="button"${live ? '' : ' disabled'}>❝ Quote selection</button><button class="act primary" id="reader-send" type="button"${live ? '' : ' disabled'}>Send</button></div>
    </div>`;
}

const CODE_LINES = 20_000;
function codeHtml(text) {
  const lines = String(text).split('\n');
  if (lines.length > 1 && lines.at(-1) === '') lines.pop();
  // Each line is its own block, so no newline characters between them (they would add blank lines).
  const shown = lines.slice(0, CODE_LINES).map((l, i) => `<span class="l" data-n="${i + 1}">${esc(l)}</span>`).join('');
  const more = lines.length > CODE_LINES ? `<div class="empty">Showing the first ${CODE_LINES.toLocaleString()} of ${lines.length.toLocaleString()} lines.</div>` : '';
  return `<pre class="code"><code>${shown}</code></pre>${more}`;
}

/** Opens a file in a tab of the agent's centre view (or switches to it). */
async function openFile(agentId, path) {
  const t = tabsOf(agentId);
  if (!t.files.includes(path)) t.files.push(path);
  t.active = path;
  if (selected !== agentId) {
    selected = agentId;
    openChildren.clear();
  }
  render();
  renderTree();
  await viewerLoading;
}

function closeTab(path) {
  const a = centreAgent();
  if (!a) return;
  const t = tabsOf(a.id);
  const i = t.files.indexOf(path);
  if (i < 0) return;
  t.files.splice(i, 1);
  if (t.active === path) t.active = t.files[i] ?? t.files[i - 1] ?? '';
  render();
  renderTree();
}

async function loadDoc({ keepScroll = false } = {}) {
  if (!reader) return;
  const { agentId, path } = reader;
  let html;
  try {
    const r = await fetch(`/api/agent/${encodeURIComponent(agentId)}/file?path=${encodeURIComponent(path)}`, { headers: { 'x-tracker-token': TOKEN } });
    const body = await r.json();
    html = !r.ok ? `<div class="empty" style="padding:12px 16px">${esc(body.error ?? `Could not load it (HTTP ${r.status}).`)}</div>`
      : body.text === '' ? '<div class="empty" style="padding:12px 16px">This file is empty.</div>'
      : isMarkdown(path) ? renderMarkdown(body.text) : codeHtml(body.text);
  } catch (err) {
    html = `<div class="empty" style="padding:12px 16px">Could not load it: ${esc(err?.message ?? err)}</div>`;
  }
  if (reader?.agentId !== agentId || reader.path !== path) return;
  const box = $('reader-body');
  const top = box.scrollTop;
  box.innerHTML = html;
  if (keepScroll) box.scrollTop = top;
}

/** When the agent changes the open file, show the new text in place. */
function refreshReader() {
  if (!reader) return;
  const t = touchOf(reader.agentId, reader.path);
  if (!t || t.at <= reader.at) return;
  reader.at = t.at;
  const agent = snap.agents.find(a => a.id === reader.agentId);
  $('reader-sub').textContent = docSub(agent, reader.path);
  if (hasSelection()) $('reader-status').textContent = `${agent?.name ?? 'The agent'} changed this file. ↻ Reload to see it.`;
  else void loadDoc({ keepScroll: true });
}

const lineOf = node => Number((node?.nodeType === 1 ? node : node?.parentElement)?.closest?.('.l')?.dataset.n) || 0;
function captureReaderSelection() {
  if (!reader) return;
  const s = window.getSelection?.();
  if (!s || s.isCollapsed || !s.toString().trim()) return;
  const node = s.anchorNode;
  if (node && !$('reader-body').contains?.(node)) return;
  readerQuote = s.toString();
  const ends = [lineOf(s.anchorNode), lineOf(s.focusNode)].filter(Boolean);
  readerLines = ends.length ? [Math.min(...ends), Math.max(...ends)] : null;
}

function quoteSelection() {
  captureReaderSelection();
  const text = readerQuote.trim();
  if (!text) {
    $('reader-status').textContent = 'Select some text in the file first.';
    return;
  }
  const prev = readerDrafts.get(readerKey()) ?? '';
  const where = readerLines ? (readerLines[0] === readerLines[1] ? `Line ${readerLines[0]}:\n` : `Lines ${readerLines[0]}–${readerLines[1]}:\n`) : '';
  const quoted = where + text.split('\n').map(l => `> ${l}`.trimEnd()).join('\n');
  const next = `${prev}${prev && !prev.endsWith('\n\n') ? (prev.endsWith('\n') ? '\n' : '\n\n') : ''}${quoted}\n\n`;
  readerDrafts.set(readerKey(), next);
  const box = $('reader-text');
  box.value = next;
  box.focus?.();
  readerQuote = '';
  readerLines = null;
}

async function sendReaderReply() {
  if (!reader) return;
  const { agentId, path } = reader;
  const key = readerKey();
  const reply = (readerDrafts.get(key) ?? '').trim();
  if (!reply) {
    $('reader-status').textContent = 'Type a reply first.';
    return;
  }
  const agent = snap?.agents.find(a => a.id === agentId);
  const button = $('reader-send');
  button.disabled = true;
  button.textContent = 'Sending…';
  const r = await post('/api/actions/message', { agentId, text: `About ${docLabel(agent, path)}:\n\n${reply}` });
  button.disabled = false;
  button.textContent = 'Send';
  if (r.ok) {
    readerDrafts.delete(key);
    $('reader-text').value = '';
  }
  $('reader-status').textContent = r.ok
    ? (agent?.state === 'working' ? `Queued for ${agent.name}: it reads it when its current step ends.` : `✓ Sent to ${agent?.name ?? 'the session'}.`)
    : `Not sent: ${r.error}`;
}

/* ---------- the centre: the agent you're looking at, and the files you opened from it ---------- */

function centreAgent() {
  if (!snap) return null;
  let a = selected ? snap.agents.find(x => x.id === selected) : null;
  if (!a) {
    a = snap.agents.find(x => x.state === 'waiting' || x.state === 'working' || x.state === 'yourTurn') ?? snap.agents[0] ?? null;
    selected = a?.id ?? null;
  }
  return a;
}

function renderCentre() {
  const a = centreAgent();
  const body = $('center-body');
  if (!a) {
    $('center-tabs').innerHTML = '';
    body.className = 'center-body';
    body.innerHTML = '<div class="empty">No agents are running.</div>';
    shownKey = '';
    reader = null;
    return;
  }
  const t = tabsOf(a.id);
  if (t.active && !t.files.includes(t.active)) t.active = '';
  $('center-tabs').innerHTML = tabsHtml(a, t);
  const key = `${a.id}\n${t.active}`;
  if (!t.active) {
    reader = null;
    shownKey = key;
    body.className = 'center-body';
    body.innerHTML = overviewHtml(a);
  } else if (key !== shownKey) {
    shownKey = key;
    reader = { agentId: a.id, path: t.active, at: touchOf(a.id, t.active)?.at ?? 0 };
    readerQuote = '';
    readerLines = null;
    body.className = 'center-body viewing';
    body.innerHTML = readerHtml();
    $('reader-body').innerHTML = '<div class="empty" style="padding:12px 16px">Loading…</div>';
    viewerLoading = loadDoc();
  }
}

/* ---------- explorer: the agent's folder, like an editor's file tree ---------- */

let explorer = { agentId: null, data: null, error: '', loading: false, fetchedAt: 0, seenActivity: 0 };
const expanded = new Map(); // agent id → open folder paths
let filterText = '';
const STATUS_WORD = { M: 'modified', U: 'new, not committed', A: 'added', D: 'deleted', R: 'renamed' };
const treeCache = new WeakMap();
const byName = (x, y) => x.localeCompare(y, undefined, { sensitivity: 'base', numeric: true });
const openDirs = id => {
  if (!expanded.has(id)) expanded.set(id, new Set());
  return expanded.get(id);
};
const ancestors = path => {
  const parts = path.split('/');
  return parts.slice(0, -1).map((_, i) => parts.slice(0, i + 1).join('/'));
};
const browsable = a => Boolean(a?.cwd) && a.kind !== 'codex';

/** Follows the centre agent: a new agent gets its listing; a working one is re-listed every few seconds. */
function syncExplorer() {
  const a = centreAgent();
  const id = a?.id ?? null;
  if (id !== explorer.agentId) {
    explorer = { agentId: id, data: null, error: '', loading: false, fetchedAt: 0, seenActivity: 0 };
    renderTree();
    if (browsable(a)) void fetchListing();
    return;
  }
  if (browsable(a) && !explorer.loading && a.lastActivityAt !== explorer.seenActivity && Date.now() - explorer.fetchedAt > 3000) void fetchListing();
}

async function fetchListing() {
  const id = explorer.agentId;
  if (!id) return;
  explorer.loading = true;
  explorer.seenActivity = snap?.agents.find(x => x.id === id)?.lastActivityAt;
  let data = null;
  let error = '';
  try {
    const r = await fetch(`/api/agent/${encodeURIComponent(id)}/files`, { headers: { 'x-tracker-token': TOKEN } });
    const body = await r.json();
    if (r.ok) data = body;
    else error = body.error ?? `Could not list the folder (HTTP ${r.status}).`;
  } catch (err) {
    error = `Could not list the folder: ${err?.message ?? err}`;
  }
  if (explorer.agentId !== id) return;
  explorer.loading = false;
  explorer.fetchedAt = Date.now();
  if (data && !explorer.data) {
    // First look at this folder: open the folders holding files the agent wrote.
    const dirs = openDirs(id);
    for (const [path, t] of Object.entries(data.touched ?? {})) if (t.wrote) for (const d of ancestors(path)) dirs.add(d);
    const scratchDirs = openDirs(`${id}\nscratch`);
    for (const [path, t] of Object.entries(data.scratch?.touched ?? {})) if (t.wrote) for (const d of ancestors(path)) scratchDirs.add(d);
  }
  if (data) explorer.data = data;
  explorer.error = data ? '' : error;
  renderTree();
  if (reader?.agentId === id) refreshReader();
}

function treeOf(data) {
  if (treeCache.has(data)) return treeCache.get(data);
  const root = { dirs: new Map(), files: [] };
  for (const f of data.files) {
    const parts = f.split('/');
    let node = root;
    for (const part of parts.slice(0, -1)) {
      if (!node.dirs.has(part)) node.dirs.set(part, { dirs: new Map(), files: [] });
      node = node.dirs.get(part);
    }
    node.files.push(parts.at(-1));
  }
  treeCache.set(data, root);
  return root;
}

function fileRow(path, label, depth, ctx, sub = '') {
  const st = ctx.status[path];
  const t = ctx.touched[path];
  const tip = [t ? `${t.wrote ? 'Edited' : 'Read'} by ${ctx.name} at ${hhmm(t.at)}` : '', st ? `git: ${STATUS_WORD[st] ?? st}` : ''].filter(Boolean).join(' · ') || path;
  const on = reader?.path === `${ctx.root}/${path}`;
  return `<button class="tn file${st ? ` st-${st}` : ''}${on ? ' on' : ''}" type="button" data-${ctx.fileAttr}="${esc(path)}" style="--d:${depth}" data-tip="${esc(tip)}"><span class="tw"></span><span class="tname">${esc(label)}</span>${sub ? `<span class="tsub">${esc(sub)}</span>` : ''}${t ? `<i class="mine${t.wrote ? '' : ' read'}" style="--c:${ctx.color}"></i>` : ''}${st ? `<span class="tst">${esc(st)}</span>` : ''}</button>`;
}

/** A small deploy mark for a repo, from the Repos panel's GitHub Actions status. */
function deployMark(d) {
  if (!d) return '';
  if (d.status !== 'completed') return `<span class="dep run" data-tip="${esc(`${d.workflow ?? 'Deploy'} ${d.status} · ${d.sha}`)}">●</span>`;
  return d.conclusion === 'success' ? '<span class="dep ok" data-tip="Deployed">✓</span>'
    : d.conclusion === 'failure' ? `<span class="dep bad" data-tip="${esc(`${d.workflow ?? 'Deploy'} failed at ${d.sha}`)}">✗</span>` : '';
}
const deployOf = top => snap?.repos?.find(r => r.path === top)?.deploy;

function treeRows(node, prefix, depth, out, ctx) {
  for (const name of [...node.dirs.keys()].sort(byName)) {
    const path = prefix ? `${prefix}/${name}` : name;
    const open = ctx.open.has(path);
    const mine = ctx.mine.has(path) ? `<i class="mine" style="--c:${ctx.color}" data-tip="${esc(`${ctx.name} edited files in here`)}"></i>` : '';
    const repo = ctx.repos.get(path);
    const tag = repo ? `<span class="repo-tag" data-tip="${esc(`Git repo ${repo.name}, on ${repo.branch}`)}">⎇ ${esc(repo.branch)}</span>${deployMark(deployOf(repo.top))}` : '';
    out.push(`<button class="tn dir${repo ? ' repo' : ''}${ctx.changed.has(path) ? ' changed' : ''}" type="button" data-${ctx.dirAttr}="${esc(path)}" aria-expanded="${open}" style="--d:${depth}"><span class="tw">${open ? '▾' : '▸'}</span><span class="tname">${esc(name)}</span>${mine}${tag}</button>`);
    if (open) treeRows(node.dirs.get(name), path, depth + 1, out, ctx);
  }
  for (const name of [...node.files].sort(byName)) out.push(fileRow(prefix ? `${prefix}/${name}` : name, name, depth, ctx));
}

const emptyRow = text => `<div class="empty" style="padding:2px 10px 4px">${text}</div>`;
const sectionHead = (key, title, sub = '') => `<button class="ex-sec" type="button" data-group="${key}" aria-expanded="${isOpen(key)}"><span class="tw">${isOpen(key) ? '▾' : '▸'}</span>${title}${sub ? `<span class="tsub">${esc(sub)}</span>` : ''}</button>`;
const fileLabel = path => (path === '@summary' ? 'Conversation summary' : docName(path));

// The explorer's sections: Memory and Scratchpad first (short), then the agent's folder (long).
/** One listed folder (the agent's, or its scratchpad) as a tree, or as flat matches while filtering. */
function folderRows(list, ctx, out) {
  const q = filterText.trim().toLowerCase();
  if (q) {
    const hits = list.files.filter(f => f.toLowerCase().includes(q));
    for (const f of hits.slice(0, 300)) out.push(fileRow(f, docName(f), 0, ctx, f.split('/').slice(0, -1).join('/')));
    if (!hits.length) out.push(emptyRow('No file names match.'));
    else if (hits.length > 300) out.push(emptyRow(`Showing 300 of ${hits.length} matches.`));
  } else {
    treeRows(treeOf(list), '', 0, out, ctx);
    if (!list.files.length) out.push(emptyRow('This folder is empty.'));
  }
  if (list.truncated) out.push(emptyRow(`Only the first ${list.files.length.toLocaleString()} files are listed.`));
}

function treeContext(agent, list, { fileAttr, dirAttr, openKey }) {
  const changed = new Set();
  const mine = new Set();
  for (const path of Object.keys(list.status ?? {})) for (const a of ancestors(path)) changed.add(a);
  for (const [path, t] of Object.entries(list.touched ?? {})) if (t.wrote) for (const a of ancestors(path)) mine.add(a);
  const repos = list.repos ?? [];
  return { root: list.root, status: list.status ?? {}, touched: list.touched ?? {}, open: openDirs(openKey), changed, mine, color: colorOf(agent.id), name: agent.name, repos: new Map(repos.filter(r => r.path).map(r => [r.path, r])), fileAttr, dirAttr };
}

function renderTree() {
  const box = $('tree');
  const agent = snap?.agents.find(x => x.id === explorer.agentId);
  if (!agent) { box.innerHTML = emptyRow('No agent selected.'); return; }
  if (!browsable(agent)) { box.innerHTML = emptyRow('This agent has no folder to show.'); return; }
  if (explorer.error) { box.innerHTML = emptyRow(esc(explorer.error)); return; }
  const d = explorer.data;
  if (!d) { box.innerHTML = emptyRow('Loading…'); return; }
  const out = [];

  out.push(sectionHead('ex-memory', 'Memory'));
  if (isOpen('ex-memory')) {
    const memRow = (path, label, where, icon, tip) => `<button class="tn file mem${reader?.path === path ? ' on' : ''}" type="button" data-mem="${esc(path)}" style="--d:0" data-tip="${esc(tip)}"><span class="tw">${icon}</span><span class="tname">${esc(label)}</span><span class="tsub">${esc(where)}</span></button>`;
    out.push(memRow('@summary', 'Conversation summary', 'after compaction', '🧠', 'What this session carries of its earlier conversation, once it has been compacted'));
    for (const m of d.memory ?? []) out.push(memRow(m.path, m.label, m.where, '📄', short(m.path)));
  }
  if (d.scratch) {
    out.push(sectionHead('ex-scratch', 'Scratchpad', `${d.scratch.files.length} file${d.scratch.files.length === 1 ? '' : 's'}`));
    if (isOpen('ex-scratch')) folderRows(d.scratch, treeContext(agent, d.scratch, { fileAttr: 'sfile', dirAttr: 'sdir', openKey: `${agent.id}\nscratch` }), out);
  }

  out.push(sectionHead('ex-folder', 'Folder', short(d.root ?? agent.cwd)));
  if (isOpen('ex-folder')) {
    if (d.folderError) out.push(emptyRow(esc(d.folderError)));
    else {
      const own = (d.repos ?? []).find(r => r.path === '');
      if (own) {
        const n = Object.keys(d.status ?? {}).length;
        out.push(`<div class="ex-repo" data-tip="${esc(`Git repo at ${short(own.top)}`)}">⎇ <b>${esc(own.name)}</b><span>${esc(own.branch)}</span><span class="faint">· ${n ? `${n} changed` : 'clean'}</span>${deployMark(deployOf(own.top))}</div>`);
      }
      folderRows(d, treeContext(agent, d, { fileAttr: 'file', dirAttr: 'dir', openKey: agent.id }), out);
    }
  }

  box.innerHTML = out.join('');
}

function toggleDir(key, path) {
  const dirs = openDirs(key);
  if (dirs.has(path)) dirs.delete(path);
  else dirs.add(path);
  renderTree();
}

function overviewHtml(a) {
  const color = colorOf(a.id);
  const h = a.proc?.history;
  const charts = h ? `<div class="charts">${lineChart('CPU', h.at, h.cpu, color, v => `${Math.round(v)}%`)}${lineChart('Memory', h.at, h.rssMb, color, v => gb(v))}</div>
    <details class="data"><summary>Table view</summary><table><tr><th>Time</th><th>CPU</th><th>Memory</th></tr>${h.at.slice(-10).map((t, i, arr) => {
      const j = h.at.length - arr.length + i;
      return `<tr><td>${clock(t)}</td><td>${Math.round(h.cpu[j])}%</td><td>${gb(h.rssMb[j])}</td></tr>`;
    }).join('')}</table></details>` : '';
  const children = a.children.length ? a.children.map(c => {
    const isOpen = openChildren.has(c.id);
    const feed = isOpen ? `<div class="feed">${(openChildren.get(c.id) ?? []).map(feedRow).join('') || '<div class="empty">No activity.</div>'}</div>` : '';
    return `<div class="child"><button class="act" data-child="${esc(c.id)}">${isOpen ? '▾' : '▸'}</button><b>${esc(c.kind)}</b> ${esc(c.label)} <span class="chip ${c.state === 'running' ? 'c-working live-dot' : 'c-plain'}">${esc(c.state)}${c.now ? ` · ${esc(c.now.tool)}` : ''}</span>${feed}</div>`;
  }).join('') : '<div class="empty">None.</div>';
  const touching = a.touching.length
    ? `<div class="badges">${a.touching.slice(0, 12).map(t => `<span class="chip ${t.mode === 'read' ? 'c-plain' : t.mode === 'git' ? 'c-serious' : 'c-warn'}" data-tip="${esc(t.path)}">${esc(short(t.repo ?? t.path))} · ${esc(t.mode)}</span>`).join('')}</div>`
    : '<div class="empty">Nothing in the last 30 minutes.</div>';
  const proc = a.proc
    ? `CPU <b>${Math.round(a.proc.cpu)}%</b> · RAM <b>${gb(a.proc.rssMb)}</b> · ${a.proc.childCount} child process${a.proc.childCount === 1 ? '' : 'es'}${a.proc.children.length ? ` <span class="muted">(${esc(a.proc.children.join(', '))})</span>` : ''}`
    : '<span class="muted">No process found.</span>';
  const resume = a.kind === 'codex' ? '' : `cd ${shellQuote(a.cwd)} && claude --resume ${a.id}`;
  return `<div class="ov"><div class="head"><span class="swatch" style="background:${color}"></span><span class="name">${esc(a.name)}</span><span class="chip c-${a.state}">${STATE_CHIP[a.state] ?? esc(a.state)} · <span data-since="${a.stateSince}"></span></span></div>
    ${askHtml(a)}
    <div class="muted" style="margin-top:6px">${esc(short(a.cwd))} · ${esc(a.kind)}${a.model ? ` · ${esc(a.model)}` : ''}
      ${a.kind === 'codex' ? '' : a.mod?.live
        ? ' <span class="chip c-good" data-tip="This session can be answered from the dashboard">📡 dashboard answers on</span>'
        : ' <span class="chip c-plain" data-tip="The Agent Tracker mod in this session isn\'t listening. It starts with the next message you send the session, or with a new session.">dashboard answers off</span>'}</div>
    ${a.state === 'stale' ? '' : `<div style="margin-top:8px">${metricsHtml(a)}</div>`}
    <div class="sec">Now</div>${a.now ? `<div class="now mono"><span class="pulse"></span> ${esc(a.now.tool)} ${esc(a.now.summary)} · <b data-since="${a.now.startedAt}"></b></div>` : `<div class="muted">${esc(a.stateReason)}</div>`}
    ${composeHtml(a)}
    <div class="sec">Activity</div><div class="feed">${a.feed.map(feedRow).join('') || '<div class="empty">No activity yet.</div>'}</div>
    ${docsHtml(a)}
    ${charts ? `<div class="sec">Last 10 minutes</div>${charts}` : ''}
    ${a.kind === 'codex' ? '' : `<div class="sec">Tool calls · last 30 minutes</div>${timelineChart(a.timeline)}`}
    <div class="sec">Subagents &amp; background jobs</div>${children}
    <div class="sec">Touching</div>${touching}
    <div class="sec">Process</div><div>${proc}</div>
    <div class="sec">Actions</div>
    ${a.kind === 'background' && a.cliId ? '<button class="act" id="act-open">Open session</button>' : ''}
    ${resume ? `<button class="act" id="act-copy" data-text="${esc(resume)}">Copy resume command</button>` : ''}
    ${a.kind === 'codex' ? '' : `<a class="act" href="/agent/${encodeURIComponent(a.id)}/transcript" target="_blank" rel="noopener">Full transcript</a>`}</div>`;
}

function render() {
  if (!snap) return;
  syncSlots(snap.agents);
  $('kpis').innerHTML = kpisHtml();
  $('errors').innerHTML = Object.entries(snap.sources).filter(([, s]) => !s.ok)
    .map(([n, s]) => `<span class="pill p-err" title="${esc(s.error)}">${esc(n)}: ${esc(String(s.error).slice(0, 40))}</span>`).join(' ');
  $('hstats').innerHTML = hstatsHtml();
  if (view === 'farm') {
    // The farm draws the agents; the list and the centre are not drawn (so their ids don't exist twice).
    window.TrackerFarm?.update(snap);
    updateTimers();
    return;
  }
  centreAgent(); // settle the default before the rows mark the selected one
  $('list').innerHTML = listHtml();
  $('rail').innerHTML = railHtml();
  renderCentre();
  syncExplorer();
  updateTimers();
}

/* ---------- two views: the list (default) and the pixel farm ---------- */

let view = loadView();
function loadView() {
  try {
    return localStorage.getItem('tracker-view') === 'farm' ? 'farm' : 'list';
  } catch {
    return 'list';
  }
}
function setView(next, { remember = true } = {}) {
  if (next === 'farm' && !window.TrackerFarm) {
    notice('The farm view could not load.');
    next = 'list';
    remember = false;
  }
  if (view === 'farm' && next === 'list') window.TrackerFarm?.unmount();
  view = next;
  if (remember) {
    try { localStorage.setItem('tracker-view', next); } catch { /* lasts this page only */ }
  }
  $('main').dataset.view = next;
  $('view-list').setAttribute('aria-pressed', next === 'list');
  $('view-farm').setAttribute('aria-pressed', next === 'farm');
  if (next === 'farm') {
    window.TrackerFarm.mount($('farm'), { token: TOKEN, onPickAgent: pickFromFarm, onOpenDoc: openDocFromFarm, onShowRepos: showReposFromFarm });
  } else {
    shownKey = ''; // the centre wasn't drawn while the farm was up
  }
  render();
}
/** A farmer was clicked: show that agent in the list view, where it can be answered or messaged. */
function pickFromFarm(id) {
  if (selected !== id) openChildren.clear();
  selected = id;
  setView('list');
}
/** A noticeboard in a field close-up: read that document in the list view's reader. */
async function openDocFromFarm(agentId, path) {
  setView('list');
  await openFile(agentId, path);
}
/** The "+N more fields" signpost: the list view, with the repos group open. */
function showReposFromFarm() {
  closedGroups.delete('repos');
  try { localStorage.setItem('tracker-closed-groups', JSON.stringify([...closedGroups])); } catch { /* lasts this page only */ }
  setView('list');
  $('rail').scrollIntoView?.({ block: 'start' });
}

/* ---------- interaction ---------- */

function showTip(text, e) {
  const tip = $('tip');
  tip.textContent = text;
  tip.classList.add('show');
  tip.style.left = `${Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8)}px`;
  tip.style.top = `${e.clientY + 16}px`;
}
const hideTip = () => $('tip').classList.remove('show');

// Crosshair snaps to the nearest sample; other marks carry their own data-tip.
document.addEventListener('pointermove', e => {
  const svg = e.target.closest?.('svg[data-chart]');
  if (svg) {
    const data = JSON.parse(svg.dataset.chart);
    const box = svg.getBoundingClientRect();
    const vx = ((e.clientX - box.left) / box.width) * svg.viewBox.baseVal.width;
    let best = 0;
    for (let i = 1; i < data.x.length; i++) if (Math.abs(data.x[i] - vx) < Math.abs(data.x[best] - vx)) best = i;
    const xh = svg.querySelector('.xh');
    xh.setAttribute('x1', data.x[best]);
    xh.setAttribute('x2', data.x[best]);
    xh.style.opacity = 1;
    const xd = svg.querySelector('.xd');
    xd.setAttribute('cx', data.x[best]);
    xd.setAttribute('cy', data.y[best]);
    xd.style.opacity = 1;
    showTip(data.t[best], e);
    return;
  }
  const el = e.target.closest?.('[data-tip]');
  if (el) showTip(el.dataset.tip, e);
  else hideTip();
});
document.addEventListener('pointerout', e => {
  const svg = e.target.closest?.('svg[data-chart]');
  if (svg && !svg.contains(e.relatedTarget)) {
    svg.querySelector('.xh').style.opacity = 0;
    svg.querySelector('.xd').style.opacity = 0;
    hideTip();
  }
});

async function post(path, body) {
  try {
    const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json', 'x-tracker-token': TOKEN }, body: JSON.stringify(body) });
    return await r.json();
  } catch (err) {
    return { ok: false, error: String(err) };
  }
}

function notice(text) {
  $('notice').textContent = text;
  $('notice').classList.add('show');
  setTimeout(() => $('notice').classList.remove('show'), 6000);
}

function openCleanup() {
  const stale = snap.agents.filter(a => a.state === 'stale' && a.kind === 'background');
  $('cleanup-list').innerHTML = stale.length
    ? stale.map(a => `<label style="display:block;margin:4px 0"><input type="checkbox" value="${esc(a.id)}"> ${esc(a.name)} <span class="muted">· ${esc(short(a.cwd))} · last active ${ago(a.lastActivityAt)}</span></label>`).join('')
    : '<p class="empty">No stale background sessions.</p>';
  $('cleanup').showModal();
}

$('cleanup').addEventListener('close', async () => {
  if ($('cleanup').returnValue !== 'go') return;
  const ids = [...$('cleanup-list').querySelectorAll('input:checked')].map(i => i.value);
  if (!ids.length) return;
  const r = await post('/api/actions/rm', { ids });
  const failed = (r.results ?? []).filter(x => !x.ok);
  notice(failed.length ? `Could not remove ${failed.length}: ${failed.map(f => f.error).join('; ')}` : `Removed ${ids.length} stale session${ids.length > 1 ? 's' : ''}.`);
});

document.addEventListener('click', async e => {
  const row = e.target.closest('.row[data-id]');
  if (row) {
    if (row.dataset.id !== selected) {
      selected = row.dataset.id;
      openChildren.clear();
    }
    render();
    return;
  }
  const el = e.target.closest('button');
  if (!el) return;
  const d = el.dataset;
  if (el.id === 'view-list' || el.id === 'view-farm') { setView(el.id === 'view-farm' ? 'farm' : 'list'); return; }
  if (el.id === 'msg-send') { await sendMessage(d.agent, el); return; }
  if (d.removeImg !== undefined) { removeImage(d.agent, Number(d.removeImg)); return; }
  if (el.id === 'msg-attach') {
    pickerFor = d.agent;
    $('img-picker').value = '';
    $('img-picker').click?.();
    return;
  }
  if (d.docPath) { await openFile(d.docAgent, d.docPath); return; }
  if (d.closeTab !== undefined) { closeTab(d.closeTab); return; }
  if (d.tab !== undefined) {
    const a = centreAgent();
    if (a) {
      tabsOf(a.id).active = d.tab;
      render();
      renderTree();
      await viewerLoading;
    }
    return;
  }
  if (d.dir !== undefined) { toggleDir(explorer.agentId, d.dir); return; }
  if (d.sdir !== undefined) { toggleDir(`${explorer.agentId}\nscratch`, d.sdir); return; }
  if (d.file !== undefined) {
    if (explorer.data) await openFile(explorer.agentId, `${explorer.data.root}/${d.file}`);
    return;
  }
  if (d.sfile !== undefined) {
    if (explorer.data?.scratch) await openFile(explorer.agentId, `${explorer.data.scratch.root}/${d.sfile}`);
    return;
  }
  if (d.mem !== undefined) { await openFile(explorer.agentId, d.mem); return; }
  if (d.group) { toggleGroup(d.group); return; }
  if (el.id === 'ex-refresh') { await fetchListing(); return; }
  if (el.id === 'reader-reload') { await loadDoc({ keepScroll: true }); return; }
  if (el.id === 'reader-quote') { quoteSelection(); return; }
  if (el.id === 'reader-send') { await sendReaderReply(); return; }
  if (el.id === 'ask-send') {
    el.disabled = true;
    el.textContent = 'Sending…';
    await sendAnswer(d.agent, d.tool);
    return;
  }
  if (el.id === 'ask-allow' || el.id === 'ask-deny') {
    const decision = el.id === 'ask-allow' ? 'allow' : 'deny';
    el.disabled = true;
    el.textContent = decision === 'allow' ? 'Allowing…' : 'Denying…';
    const r = await post('/api/actions/permit', { agentId: d.agent, toolUseId: d.tool, decision });
    notice(r.ok ? (decision === 'allow' ? 'Allowed.' : 'Denied.') : `Could not send: ${r.error}`);
    return;
  }
  if (el.id === 'theme-toggle') { theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length]; saveTheme(theme); applyTheme(theme); }
  else if (el.id === 'open-cleanup') openCleanup();
  else if (el.id === 'act-copy') { await navigator.clipboard.writeText(d.text); notice('Resume command copied.'); }
  else if (el.id === 'act-open') { const r = await post(`/api/actions/open/${encodeURIComponent(selected)}`, {}); notice(r.ok ? 'Opened in Terminal.' : `Could not open: ${r.error}`); }
  else if (d.child) {
    const id = d.child;
    if (openChildren.has(id)) openChildren.delete(id);
    else {
      const r = await fetch(`/api/agent/${encodeURIComponent(selected)}:${encodeURIComponent(id)}/feed?limit=30`);
      openChildren.set(id, r.ok ? await r.json() : []);
    }
    render();
  }
});

// Snapshots arrive every few seconds. Re-rendering replaces the DOM, which would wipe a
// text selection (copying a path or prompt), swallow a click that straddles it, or clobber
// typing, so a snapshot waits while text is selected, the pointer is down, or a box is typed in.
let isPointerDown = false;
let isRenderPending = false;
const isTyping = () => {
  const el = document.activeElement;
  return Boolean(el && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && el.type === 'text')));
};
const hasSelection = () => {
  const s = window.getSelection?.();
  return Boolean(s && !s.isCollapsed && s.toString() !== '');
};
function requestRender() {
  if (isPointerDown || hasSelection() || isTyping()) {
    isRenderPending = true;
    return;
  }
  isRenderPending = false;
  render();
}
document.addEventListener('pointerdown', () => { isPointerDown = true; });
document.addEventListener('pointerup', () => {
  isPointerDown = false;
  setTimeout(() => { if (isRenderPending) requestRender(); }, 0);
});
document.addEventListener('focusout', () => setTimeout(() => { if (isRenderPending) requestRender(); }, 0));
document.addEventListener('selectionchange', () => { if (isRenderPending && !hasSelection()) requestRender(); });
document.addEventListener('selectionchange', captureReaderSelection);

// Answer drafts survive the drawer re-rendering on every snapshot.
document.addEventListener('change', e => {
  const t = e.target;
  if (t?.id === 'img-picker') {
    if (pickerFor) addImages(pickerFor, [...(t.files ?? [])]);
    t.value = '';
    return;
  }
  if (!t?.dataset?.tool || t.dataset.q === undefined || t.type === 'text') return;
  const d = draftFor(t.dataset.tool);
  const qi = Number(t.dataset.q);
  const picks = t.type === 'radio' ? new Set() : new Set(d.picks.get(qi) ?? []);
  if (t.checked) picks.add(t.value);
  else picks.delete(t.value);
  d.picks.set(qi, picks);
});
// Screenshots: paste them into the message box, or drop them on it.
document.addEventListener('paste', e => {
  const agentId = e.target?.dataset?.msgAgent;
  const files = [...(e.clipboardData?.files ?? [])];
  if (agentId === undefined || !files.some(f => f.type?.startsWith('image/'))) return; // plain text pastes as usual
  e.preventDefault();
  addImages(agentId, files);
});
const draggingFiles = e => [...(e.dataTransfer?.types ?? [])].includes('Files');
document.addEventListener('dragover', e => {
  if (!draggingFiles(e)) return;
  e.preventDefault(); // a dropped file must not replace the dashboard
  document.querySelectorAll('.compose.dragging').forEach(c => c.classList.remove('dragging'));
  e.target?.closest?.('.compose[data-agent]')?.classList.add('dragging');
});
document.addEventListener('drop', e => {
  if (!draggingFiles(e)) return;
  e.preventDefault();
  document.querySelectorAll('.compose.dragging').forEach(c => c.classList.remove('dragging'));
  const box = e.target?.closest?.('.compose[data-agent]');
  if (box) addImages(box.dataset.agent, [...(e.dataTransfer?.files ?? [])]);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target?.id === 'msg-text') {
    e.preventDefault();
    sendMessage(e.target.dataset.msgAgent, $('msg-send'));
  }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target?.id === 'reader-text') {
    e.preventDefault();
    sendReaderReply();
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t?.id === 'ex-filter') {
    filterText = t.value;
    renderTree();
    return;
  }
  if (t?.id === 'reader-text') {
    readerDrafts.set(readerKey(), t.value);
    return;
  }
  if (t?.dataset?.msgAgent !== undefined) {
    msgDrafts.set(t.dataset.msgAgent, t.value);
    return;
  }
  if (!t?.dataset?.tool || t.dataset.q === undefined || t.type !== 'text') return;
  draftFor(t.dataset.tool).other.set(Number(t.dataset.q), t.value);
});

async function sendAnswer(agentId, toolUseId) {
  const agent = snap?.agents.find(a => a.id === agentId);
  const ask = agent?.ask;
  if (ask?.kind !== 'question' || ask.toolUseId !== toolUseId) {
    notice('That question is no longer waiting.');
    return;
  }
  const d = draftFor(toolUseId);
  const answers = {};
  for (const [qi, q] of ask.questions.entries()) {
    const value = (d.other.get(qi) ?? '').trim() || [...(d.picks.get(qi) ?? [])].join(', ');
    if (!value) {
      notice('Answer every question first.');
      return;
    }
    answers[q.question] = value;
  }
  const r = await post('/api/actions/answer', { agentId, toolUseId, answers });
  if (r.ok) drafts.delete(toolUseId);
  notice(r.ok ? `Answer sent to ${agent.name}.` : `Could not send: ${r.error}`);
}

function connect() {
  const events = new EventSource('/api/events');
  events.addEventListener('snapshot', ev => {
    snap = JSON.parse(ev.data);
    $('banner').classList.remove('show');
    $('live').classList.remove('off');
    if (selected && !snap.agents.some(a => a.id === selected)) selected = null;
    if (reader) refreshReader();
    requestRender();
  });
  events.onerror = () => {
    $('banner').classList.add('show');
    $('live').classList.add('off');
  };
}

// Dark first: no saved choice means Dark. Auto follows macOS.
const THEMES = ['auto', 'light', 'dark'];
const THEME_LABELS = { auto: '◐ Auto', light: '☀ Light', dark: '☾ Dark' };
function loadTheme() {
  try {
    const t = localStorage.getItem('tracker-theme');
    return THEMES.includes(t) ? t : 'dark';
  } catch {
    return 'dark';
  }
}
function saveTheme(t) {
  try { localStorage.setItem('tracker-theme', t); } catch { /* private window: the choice lasts this page only */ }
}
function applyTheme(t) {
  if (t === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  const button = $('theme-toggle');
  button.textContent = THEME_LABELS[t];
  button.title = `Theme: ${t} — click to change`;
}
let theme = loadTheme();
applyTheme(theme);

setInterval(updateTimers, 1000);
// farm.js loads deferred (after this script), so the remembered view is applied once the page has loaded.
const startView = () => setView(view, { remember: false });
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', startView);
else startView();
connect();
</script>
</body>
