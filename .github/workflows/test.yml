name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The macOS runner also has Chrome for the browser test.
    runs-on: macos-latest
    timeout-minutes: 30 # a hung job must not hold the runner for the default six hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collector and dashboard
        run: npm test
      - name: Dashboard in a browser
        timeout-minutes: 10 # it ran 50 s on a Mac; a step stuck past ten minutes is stuck, and its log is kept
        run: npm run test:ui

  test-windows:
    # The Windows code paths (platform/win.mjs and friends) only run here. The browser test stays on macOS.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collector and dashboard
        run: npm test
