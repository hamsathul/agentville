name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The tracker is macOS-only (launchd, ps, osascript); the runner also has Chrome for the browser test.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collector and dashboard
        run: npm test
      - name: Dashboard in a browser
        run: npm run test:ui
